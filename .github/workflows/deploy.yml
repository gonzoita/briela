name: Deploy a sistema.briela.app

# Mientras Briela esté en pruebas, cada push a main va directo al banco de pruebas.
# NO se generan paquetes ni versiones: eso empieza el día que se declare la 1.0.0, y
# desde entonces los clientes se actualizan con el botón, no con esto.
# Ver docs/BRIELA-PLAN.md sección 6.2.
#
# Secretos que hay que crear en el repo (Settings → Secrets and variables → Actions):
#   SSH_HOST · SSH_PORT · SSH_USER · SSH_KEY
# La ruta de destino NO es un secreto: va fija más abajo, a propósito.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Dos push seguidos se encolan en vez de pisarse: un deploy a medias sobre otro deploy
# a medias deja archivos de dos versiones distintas conviviendo.
concurrency:
  group: deploy-sistema
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest

    env:
      # Fija en el archivo y no en un secreto, porque más abajo hay un rsync --delete y
      # en esta misma cuenta de hosting viven otros sitios en producción. Una ruta
      # equivocada aquí no sería un error recuperable, y un secreto mal escrito no se
      # ve en el diff — esto sí.
      RUTA: /home/u787912762/domains/briela.app/public_html/sistema

    steps:
      - name: Traer el código
        uses: actions/checkout@v4

      - name: Preparar PHP y Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Instalar dependencias de producción
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: Marcar qué commit queda instalado
        # Durante las pruebas los números de versión no significan nada, pero saber
        # exactamente qué está arriba sí. El latido de licencia reporta esto.
        run: echo "dev-${GITHUB_SHA::7}" > version.txt

      - name: Comprobar que los secretos están puestos
        # Sin esto, un secreto vacío se cuela hasta el archivo de configuración de ssh y
        # el error que aparece es "no hay una instalación en la ruta" — que manda a
        # revisar el servidor cuando el problema está en GitHub. Pasó en la primera
        # corrida real, con SSH_USER sin crear.
        env:
          H: ${{ secrets.SSH_HOST }}
          P: ${{ secrets.SSH_PORT }}
          U: ${{ secrets.SSH_USER }}
          K: ${{ secrets.SSH_KEY }}
        run: |
          FALTAN=""
          [ -n "$H" ] || FALTAN="$FALTAN SSH_HOST"
          [ -n "$P" ] || FALTAN="$FALTAN SSH_PORT"
          [ -n "$U" ] || FALTAN="$FALTAN SSH_USER"
          [ -n "$K" ] || FALTAN="$FALTAN SSH_KEY"
          [ -z "$FALTAN" ] || { echo "::error::Faltan secretos en este repositorio:$FALTAN — se crean en Settings → Secrets and variables → Actions. Ojo: cada repositorio tiene los suyos."; exit 1; }
          echo "Los cuatro secretos están puestos."

      - name: Preparar el acceso SSH
        # Los secretos se escriben a mano, así que se les quitan espacios y saltos de
        # línea: un carácter invisible al final del puerto hace fallar la conexión con un
        # error que no dice nada.
        #
        # Antes había un ssh-keyscan con verificación estricta. Se quitó: keyscan confía
        # en lo que le responda el servidor, así que no da más seguridad que aceptar la
        # huella en el primer contacto — solo agrega un punto de falla, y falló.
        env:
          H: ${{ secrets.SSH_HOST }}
          P: ${{ secrets.SSH_PORT }}
          U: ${{ secrets.SSH_USER }}
          K: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$K" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf 'Host destino\n  HostName %s\n  Port %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  StrictHostKeyChecking accept-new\n  ConnectTimeout 20\n  BatchMode yes\n' \
            "$(printf '%s' "$H" | tr -d '[:space:]')" \
            "$(printf '%s' "$P" | tr -d '[:space:]')" \
            "$(printf '%s' "$U" | tr -d '[:space:]')" > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Comprobar que se puede entrar al servidor
        # Un paso aparte para que el error diga qué falló. Antes, cualquier problema de
        # conexión aparecía como "no hay una instalación en la ruta".
        run: |
          ssh destino "echo conectado como \$(whoami) en \$(hostname)" \
            || { echo "::error::No se pudo entrar al servidor por SSH. Revisa SSH_HOST, SSH_PORT, SSH_USER y que SSH_KEY esté completa, con sus líneas BEGIN y END."; exit 1; }

      - name: Comprobar que la carpeta de destino es la correcta
        # El rsync del paso siguiente borra lo que no esté en el repo. Antes de eso se
        # verifica que al otro lado haya una instalación de Briela y no otra cosa: si
        # la ruta estuviera mal, el deploy se detiene aquí en vez de arrasar un sitio.
        run: |
          ssh destino "test -f '${{ env.RUTA }}/artisan' && test -f '${{ env.RUTA }}/.env'" \
            || { echo "::error::En ${{ env.RUTA }} no hay una instalación de Briela. Deploy detenido."; exit 1; }

      - name: Respaldar la base antes de tocar nada
        # Obligatorio y antes de todo. Las credenciales se pasan por archivo temporal y
        # no en la línea de comandos, donde cualquier otro usuario del servidor
        # compartido podría verlas listando procesos.
        run: |
          ssh destino "set -e
            cd '${{ env.RUTA }}'
            mkdir -p storage/app/backups
            CNF=\$(mktemp)
            chmod 600 \$CNF
            printf '[client]\nuser=%s\npassword=%s\n' \
              \"\$(grep '^DB_USERNAME=' .env | cut -d= -f2- | tr -d '\\\"')\" \
              \"\$(grep '^DB_PASSWORD=' .env | cut -d= -f2- | tr -d '\\\"')\" > \$CNF
            BASE=\$(grep '^DB_DATABASE=' .env | cut -d= -f2- | tr -d '\\\"')
            mysqldump --defaults-extra-file=\$CNF --single-transaction --default-character-set=utf8mb4 \"\$BASE\" \
              > storage/app/backups/deploy-\$(date +%F-%H%M%S).sql
            rm -f \$CNF
            # Se guardan los diez últimos: en un hosting compartido el disco y los
            # inodos son finitos, y un respaldo por push los agota.
            ls -1t storage/app/backups/deploy-*.sql | tail -n +11 | xargs -r rm --
            ls -1t storage/app/backups/deploy-*.sql | head -1"

      - name: Enviar los archivos
        # Nunca .env, storage/ ni public/storage: son la configuración y los archivos
        # que subió la empresa. El resto se reemplaza y lo que sobra se borra, para que
        # el servidor sea exactamente lo que dice el repo.
        run: |
          rsync -az --delete \
            -e "ssh" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.claude/' \
            --exclude='node_modules/' \
            --exclude='graphify-out/' \
            --exclude='docs/' \
            --exclude='tests/' \
            --exclude='installer/' \
            --exclude='CLAUDE.md' \
            --exclude='.env' \
            --exclude='storage/' \
            --exclude='public/storage' \
            ./ "destino:${{ env.RUTA }}/"

      - name: Migrar, limpiar cachés y revisar el enlace de archivos
        run: |
          ssh destino "set -e
            cd '${{ env.RUTA }}'
            php artisan migrate --force
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            # El enlace de archivos no se envía por rsync (es un enlace, no un archivo),
            # así que se comprueba en cada deploy. Sin él, las imágenes subidas se ven
            # rotas. php artisan storage:link no sirve aquí: usa exec(), desactivado.
            [ -e public/storage ] || ln -s ../storage/app/public public/storage
            php artisan --version
            cat version.txt"

      - name: Comprobar que el sitio responde
        # Se comprueba DESDE EL SERVIDOR y no desde aquí con curl: Hostinger tiene una
        # capa de protección delante que responde 403 a clientes que no parecen
        # navegadores. Un deploy correcto se reportaría como fallido, que es la peor
        # clase de falso negativo — enseña a ignorar los avisos.
        run: |
          ssh destino "cd '${{ env.RUTA }}' && php -r '
            \$app = require \"bootstrap/app.php\";
            \$k = \$app->make(Illuminate\Contracts\Http\Kernel::class);
            \$r = \$k->handle(Illuminate\Http\Request::create(\"/login\", \"GET\"));
            echo \"La pantalla de entrada devolvió \", \$r->getStatusCode(), PHP_EOL;
            exit(\$r->getStatusCode() === 200 ? 0 : 1);
          '" || { echo "::error::El sistema no devuelve 200 en /login después del deploy."; exit 1; }
